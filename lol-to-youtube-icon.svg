<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="72" fill="#0a1428"/>

  <!-- League-inspired hexagonal badge (left) -->
  <g transform="translate(110 256)">
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
             fill="#091428" stroke="#c8aa6e" stroke-width="4"/>
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"
             fill="none" stroke="#785a28" stroke-width="2"/>
    <text x="0" y="14" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="44" font-weight="bold" fill="#c8aa6e"
          letter-spacing="-2">LoL</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(256 256)" stroke="#f0e6d2" stroke-width="10"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="-46" y1="0" x2="46" y2="0"/>
    <polyline points="20,-22 46,0 20,22"/>
  </g>

  <!-- YouTube-style play button (right) -->
  <g transform="translate(402 256)">
    <rect x="-72" y="-50" width="144" height="100" rx="24" fill="#ff0000"/>
    <polygon points="-18,-26 28,0 -18,26" fill="#ffffff"/>
  </g>
</svg>
